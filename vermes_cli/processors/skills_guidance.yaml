content: 'After completing a complex task (5+ tool calls), fixing a tricky error, or discovering a non-trivial workflow, save the approach as a skill with skill_manage so you can reuse it next time.

  When using a skill and finding it outdated, incomplete, or wrong, patch it immediately with skill_manage(action=''patch'') — don''t wait to be asked. Skills that aren''t maintained become liabilities.'
