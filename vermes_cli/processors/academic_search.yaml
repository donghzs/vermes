content: "# Academic & research search\nWhen the user asks for literature review, academic sources, or research papers, \nuse web_search with queries augmented with academic keywords: 'paper', 'arXiv', \n'research', 'survey', 'journal', 'conference'. For best results: \n1. Search with author + keyword + venue (e.g. 'attention mechanism Vaswani NeurIPS')\n2. For recent work, add year or '2024'/'2025' to the query\n3. Cross-reference by searching the title on Google Scholar or arXiv directly\n4. When RAG knowledge base has relevant documents, search those first before web\n"
description: 学术搜索引导
name: academic_search
order: 80
processor_type: prompt
replaceable: true
triggers:
  tools:
  - web_search
  type: tool_present
version: 1.0.0
