# GitHub Copilot ACP agent（手写核心 recipe，勿用生成器覆盖）。
# entry_point: copilot —— 原生支持 ACP：copilot --acp --stdio。
# fingerprint.cli: copilot 探活；鉴权用 COPILOT_API_KEY（settings.json 兜底）。
name: copilot
version: 1.0.0
description: GitHub Copilot ACP agent — spawned via copilot --acp --stdio (native
  ACP support).
transport: acp
provider: copilot-acp
entry_point: copilot
args:
- --acp
- --stdio
auth:
  scheme: apikey
  env_var: COPILOT_API_KEY
  fallback_settings: ~/.vermes/settings.json
capabilities:
- code
- search
- refactor
- writing
fingerprint:
  cli:
  - copilot
  config_dirs:
  - .github
  app_bundles: []
  mcp_config: []
install_hint: https://github.com/features/copilot （GitHub Copilot CLI：npm install
  -g @github/copilot，需 GitHub 登录）
