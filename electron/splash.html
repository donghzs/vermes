<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vermes - 启动中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    -webkit-app-region: drag;  /* 可拖拽 */
  }

  .container {
    text-align: center;
    max-width: 400px;
    padding: 40px 24px;
  }

  /* ── Logo ── */
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    position: relative;
  }

  .logo svg {
    width: 100%;
    height: 100%;
  }

  .logo-dot {
    fill: #64748b;
    transition: fill 0.6s ease;
  }
  .logo-dot.active {
    fill: #8b5cf6;
  }

  /* ── 标题 ── */
  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #f1f5f9;
  }

  .version {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 32px;
    -webkit-app-region: no-drag;
  }

  /* ── 状态区域 ── */
  .status-area {
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .status-text {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 16px;
    transition: color 0.3s ease;
  }
  .status-text.error {
    color: #ef4444;
  }

  /* ── 加载动画 ── */
  .spinner {
    display: flex;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .spinner .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #6b7280;
    animation: bounce 1.4s ease-in-out infinite both;
  }

  .spinner .dot:nth-child(1) { animation-delay: -0.32s; background: #6366f1; }
  .spinner .dot:nth-child(2) { animation-delay: -0.16s; background: #8b5cf6; }
  .spinner .dot:nth-child(3) { animation-delay: 0s;      background: #a855f7; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%           { transform: scale(1.0); opacity: 1.0; }
  }

  /* ── Progress bar ── */
  .progress-bar {
    width: 200px;
    height: 3px;
    background: #1e293b;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    border-radius: 2px;
    transition: width 1s ease;
  }

  /* ── Error state ── */
  .error-icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .error-icon svg {
    width: 28px;
    height: 28px;
  }

  .error-title {
    font-size: 16px;
    font-weight: 600;
    color: #ef4444;
    margin-bottom: 8px;
  }

  .error-detail {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .retry-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    -webkit-app-region: no-drag;
  }

  .retry-btn:hover {
    background: #334155;
    border-color: #6366f1;
  }

  .retry-btn:active {
    background: #1e293b;
  }

  .retry-btn svg {
    width: 16px;
    height: 16px;
  }

  /* ── 底部引导 ── */
  .footer-hint {
    position: fixed;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    color: #334155;
    -webkit-app-region: no-drag;
  }

  /* ── 过渡 ── */
  .fade-in {
    animation: fadeIn 0.4s ease forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade-out {
    animation: fadeOut 0.3s ease forwards;
  }
  @keyframes fadeOut {
    from { opacity: 1; }
    to   { opacity: 0; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <!-- Logo -->
  <div class="logo" id="logo">
    <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="64" height="64" rx="16" fill="#00c878" opacity="0.9"/>
      <path d="M22 18 L36 54 L50 18" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>

  <!-- Title -->
  <h1>Vermes</h1>

  <!-- Status area -->
  <div class="status-area" id="statusArea">
    <!-- 初始化状态 -->
    <div id="loadingState" class="fade-in">
      <div class="spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="status-text" id="statusText" style="margin-top:20px;">正在初始化 Vermes…</div>
      <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 错误状态（默认隐藏） -->
    <div id="errorState" style="display:none;">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-title" id="errorTitle">初始化失败</div>
      <div class="error-detail" id="errorDetail">
        后端服务启动超时，请关闭应用后重新打开。
        <br>如果问题持续，请检查系统日志。
      </div>
      <button class="retry-btn" id="retryBtn" onclick="window.retryInit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
        </svg>
        重新初始化
      </button>
      <button class="retry-btn" id="diagBtn" style="display:none; margin-left:8px;">
        复制诊断信息
      </button>
    </div>
  </div>
</div>

<div class="footer-hint">Powered by vbit.top</div>

<script>
  // ── IPC 通道 (通过 preload.js 暴露) ──

  // preload 提供了 window.vermes 才走 IPC，否则用 fallback 模拟（测试环境）
  const bridge = window.vermes || {};

  function showError(msg) {
    document.getElementById('loadingState').style.display = 'none';
    const errEl = document.getElementById('errorState');
    errEl.style.display = 'block';
    errEl.classList.add('fade-in');
    if (!msg) return;
    // 支持字符串（向后兼容）或结构化对象 { detail, title, dataProtect, diagnostic }
    const detail = typeof msg === 'string' ? msg : (msg.detail || '');
    const title = (typeof msg === 'object' && msg.title) ? msg.title : '初始化失败';
    document.getElementById('errorDetail').textContent = detail;
    document.getElementById('errorTitle').textContent = title;
    // G4 UX 三件套之一：数据保护型错误显示「复制诊断信息」按钮
    const diagBtn = document.getElementById('diagBtn');
    if (typeof msg === 'object' && msg.dataProtect && msg.diagnostic) {
      diagBtn.style.display = 'inline-flex';
      diagBtn.onclick = function() {
        if (bridge.copyDiagnostic) {
          bridge.copyDiagnostic(msg.diagnostic).then(function(r) {
            diagBtn.textContent = r && r.ok ? '已复制 ✓' : '复制失败，请手动记录';
          }).catch(function() { diagBtn.textContent = '复制失败，请手动记录'; });
        }
      };
    } else {
      diagBtn.style.display = 'none';
    }
  }

  function updateProgress(label, percent) {
    const statusText = document.getElementById('statusText');
    const fill = document.getElementById('progressFill');
    if (label) statusText.textContent = label;
    if (percent !== undefined) {
      fill.style.width = Math.min(percent, 100) + '%';
    }
  }

  // 暴露重试函数供按钮 onclick 调用
  window.retryInit = function() {
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('loadingState').style.display = 'block';
    document.getElementById('loadingState').classList.add('fade-in');
    updateProgress('正在重新初始化…', 5);
    if (bridge.retryInit) {
      bridge.retryInit();
    }
  };

  // ── 监听 IPC 事件 ──
  // 这些由 main.js 从 preload bridge 发出

  if (bridge.onSplashMessage) {
    bridge.onSplashMessage(function(msg) {
      switch (msg.type) {
        case 'progress':
          updateProgress(msg.label, msg.percent);
          break;
        case 'error':
          showError(msg.detail);
          break;
        case 'ready':
          // 后端已就绪，让 main 进程做导航切换
          // 轻量闪一下"连接中…"后交给主进程
          updateProgress('连接中…', 95);
          break;
      }
    });
  } else {
    // 没有 bridge：测试模式，3 秒后模拟就绪
    setTimeout(function() {
      updateProgress('启动完毕', 100);
    }, 3000);
  }
</script>
</body>
</html>
