name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Vermes — traces conversations, LLM calls, and tool usage. Opt-in via `vermes plugins enable observability/langfuse` (or check the box in `vermes plugins`)."
author: donghzs
requires_env:
  - VERMES_LANGFUSE_PUBLIC_KEY
  - VERMES_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
