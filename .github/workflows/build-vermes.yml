name: Build Vermes Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. 2.0.6)'
        required: false
        default: '2.0.6'
      build_win:
        description: 'Build Electron Windows'
        type: boolean
        default: true
      build_mac:
        description: 'Build macOS (legacy)'
        type: boolean
        default: false

jobs:
  # ── Electron: Windows x64 (NSIS 安装包) ─────
  build-electron-windows:
    name: Build Electron Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        # vermes-backend.spec hiddenimports require fastapi/uvicorn (web),
        # sqlite_vec (vec), edge_tts (edge-tts) and anthropic (anthropic).
        # Core-only install (-e .) omits them -> backend crashes on import.
        # Python 3.12 is mandated for the Windows build (3.13 is known-broken).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,vec,edge-tts,anthropic]" pyinstaller pywin32

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend built ✓"

      - name: Sync frontend to web_dist
        run: |
          if (Test-Path "vermes_cli/web_dist") {
            Remove-Item -Recurse -Force "vermes_cli/web_dist"
          }
          Copy-Item -Recurse "frontend/dist" "vermes_cli/web_dist"
          Write-Host "web_dist synced:"
          Get-ChildItem "vermes_cli/web_dist" -Recurse | Select-Object Mode, Length, Name

      - name: Sync version
        shell: pwsh
        run: |
          # 从 vermes_cli/__init__.py 读取版本号
          $initPy = Get-Content -Path "vermes_cli/__init__.py" -Raw
          if ($initPy -match '__version__\s*=\s*"([^"]+)"') {
            $ver = $matches[1]
            Set-Content -Path "electron/version.txt" -Value $ver
            Write-Host "Version synced: $ver"
          } else {
            Write-Host "⚠️ 无法读取版本号，使用已有配置"
          }

      - name: PyInstaller build backend (vermes-backend.spec)
        run: |
          python -m PyInstaller vermes-backend.spec --noconfirm
          Write-Host "Backend built ✓"
          Get-ChildItem "dist/vermes-backend" -Recurse -Depth 0 | Select-Object Mode, Length, Name

      - name: Inject VC++ runtime DLLs
        run: |
          $BACKEND_DIR = "dist/vermes-backend"
          $VC_DLLS = @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","vcruntime140_threads.dll")
          $SYSTEM32 = "$env:SystemRoot\System32"
          $injected = 0
          foreach ($dll in $VC_DLLS) {
            $src = Join-Path $SYSTEM32 $dll
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $BACKEND_DIR $dll) -Force
              if (Test-Path (Join-Path $BACKEND_DIR "_internal")) {
                Copy-Item $src (Join-Path $BACKEND_DIR "_internal\$dll") -Force
              }
              $injected++
            }
          }
          Write-Host "Injected $injected VC++ DLLs ✓"

      - name: Smoke-test backend (prove it boots on real Windows)
        shell: pwsh
        run: |
          $exe = "dist/vermes-backend/vermes-backend.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Backend exe missing at $exe"
            exit 1
          }
          Write-Host "Launching backend for smoke test..."
          $p = Start-Process -FilePath $exe -ArgumentList "--port","9119" `
            -PassThru -RedirectStandardOutput "backend.smoke.out.log" `
            -RedirectStandardError "backend.smoke.err.log"
          Write-Host "pid=$($p.Id)"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:9119/health" -TimeoutSec 2 -ErrorAction Stop
              if ($r.status -eq "ok") {
                Write-Host "HEALTH OK: version=$($r.version)"
                $ok = $true
                break
              }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) {
            Write-Error "Backend did NOT become healthy within 90s. Dumping logs:"
            Get-Content backend.smoke.out.log -ErrorAction SilentlyContinue
            Get-Content backend.smoke.err.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Backend smoke-test PASSED on Windows ✓"

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build Electron Windows installer
        run: |
          cd electron
          npx electron-builder --win --publish=never
          Write-Host "Electron build ✓"

      - name: Verify installer
        run: |
          Get-ChildItem "dist-electron" -Recurse | Where-Object { $_.Extension -in @(".exe",".dmg") } | Select-Object Name, Length, LastWriteTime
          Get-ChildItem "dist-electron\Vermes Setup *.exe" | Select-Object Name, @{N="SizeMB";E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: vermes-electron-windows-x64
          path: dist-electron/Vermes Setup *.exe
          compression-level: 0

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist-electron/Vermes Setup *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS ARM64 ──────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    # macOS 发布走手动构建（./build-macos.sh --clean → 本地打 DMG）。
    # CI 自动打包的 DMG 命名/卷名与下载页 version.json 不匹配，且无法复现
    # 本地验证过的完整链路（含 experts_catalog.json 等数据文件打包），故禁用。
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (macOS)
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e . pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend built ✓"

      - name: Sync frontend to web_dist
        run: |
          rm -rf vermes_cli/web_dist
          cp -R frontend/dist vermes_cli/web_dist
          echo "web_dist synced:"
          ls -la vermes_cli/web_dist/assets/

      - name: Build macOS .app (PyInstaller)
        run: |
          python3 -m PyInstaller vermes-gui.spec --noconfirm
        continue-on-error: true

      - name: Fallback build (cli.spec)
        if: steps.build-macos-arm64.outcome == 'failure'
        run: |
          python3 -m PyInstaller vermes.spec --noconfirm

      - name: Ad-hoc code sign (remove quarantine)
        run: |
          if [ -d "dist/Vermes.app" ]; then
            codesign --force --deep --sign - dist/Vermes.app || true
            xattr -cr dist/Vermes.app || true
          elif [ -d "dist/vermes.app" ]; then
            codesign --force --deep --sign - dist/vermes.app || true
            xattr -cr dist/vermes.app || true
          fi

      - name: Create .dmg installer
        run: |
          if [ -d "dist/Vermes.app" ]; then
            APP="Vermes.app"
          elif [ -d "dist/vermes.app" ]; then
            APP="vermes.app"
          else
            echo "No .app found"
            exit 1
          fi
          # 创建临时目录结构
          mkdir -p /tmp/dmg-staging
          cp -r "dist/$APP" /tmp/dmg-staging/
          # 创建 Applications 链接
          ln -s /Applications /tmp/dmg-staging/Applications
          # 创建 .dmg
          hdiutil create -volname "Vermes Installer" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDZO \
            Vermes-${{ github.ref_name }}-macos-arm64.dmg
          # 同时创建 .zip（备用）
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP" Vermes-${{ github.ref_name }}-macos-arm64.zip

      - name: Upload Release Assets (macOS)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Vermes-${{ github.ref_name }}-macos-arm64.dmg
            Vermes-${{ github.ref_name }}-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows x64 ────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend built ✓"

      - name: Sync frontend to web_dist
        shell: pwsh
        run: |
          if (Test-Path "vermes_cli/web_dist") {
            Remove-Item -Recurse -Force "vermes_cli/web_dist"
          }
          Copy-Item -Recurse "frontend/dist" "vermes_cli/web_dist"
          Write-Host "web_dist synced:"
          Get-ChildItem "vermes_cli/web_dist" -Recurse | Select-Object Mode, Length, Name

      - name: Install NSIS
        run: |
          choco install nsis --version=3.10 -y --no-progress

      - name: Ensure WebView2 Runtime
        run: |
          winget install Microsoft.EdgeWebView2Runtime --silent --accept-package-agreements 2>&1 || echo "WebView2 may already be installed"

      - name: Build Windows .exe (PyInstaller)
        run: |
          echo "Building with vermes-gui.spec..."
          & "C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe" -m PyInstaller vermes-gui.spec --noconfirm 2>&1
          echo "Exit code: $LASTEXITCODE"
          echo "=== dist contents ==="
          Get-ChildItem dist -Recurse -Depth 0 | Select-Object Name, FullName | Format-Table -AutoSize

      - name: Package exe → .zip & NSIS installer
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "${{ github.ref_name }}"
          echo "ref=$ref"
          echo "=== dist folder ==="
          Get-ChildItem dist -Recurse | Select-Object Mode, Length, Name | Format-Table -AutoSize | Out-String | ForEach-Object { Write-Host $_ }
          
          # Find the .exe or folder
          if (Test-Path "dist\Vermes") {
            echo "Found: dist\Vermes (folder)"
            $src = "dist\Vermes"
          } elseif (Test-Path "dist\vermes") {
            echo "Found: dist\vermes (folder)"
            $src = "dist\vermes"
          } elseif (Test-Path "dist\Vermes.exe") {
            echo "Found: dist\Vermes.exe (onefile)"
            $src = "dist\Vermes.exe"
          } else {
            echo "ERROR: No build output found!"
            exit 1
          }
          
          # Create zip
          echo "Creating ZIP..."
          if (Test-Path $src -PathType Container) {
            Compress-Archive -Path "$src\*" -DestinationPath "Vermes-${ref}-windows-x64.zip" -Force
          } else {
            Compress-Archive -Path $src -DestinationPath "Vermes-${ref}-windows-x64.zip" -Force
          }
          echo "ZIP: Vermes-${ref}-windows-x64.zip"
          
          # NSIS installer (optional)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (Test-Path $nsis) {
            echo "Found NSIS, building installer..."
            & $nsis "packaging\vermes-installer.nsi" 2>&1
            if (Test-Path "Vermes-${ref}-windows-x64-Installer.exe") {
              echo "Installer created!"
            } else {
              echo "NSIS script failed, continuing without installer..."
            }
          } else {
            echo "NSIS not found at $nsis, continuing without installer..."
          }

      - name: Upload Release Assets (Windows x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Vermes-${{ github.ref_name }}-windows-x64.zip
            Vermes-${{ github.ref_name }}-windows-x64-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux x64 ──────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller fastapi uvicorn pywebview python-dotenv

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend built ✓"

      - name: Sync frontend to web_dist
        run: |
          rm -rf vermes_cli/web_dist
          cp -R frontend/dist vermes_cli/web_dist
          echo "web_dist synced:"
          ls -la vermes_cli/web_dist/assets/

      - name: Install system dependencies (WebView2 equivalent)
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.0 libgtk-3-dev

      - name: Build Linux binary (PyInstaller)
        run: |
          python3 -m PyInstaller vermes.spec --noconfirm
        continue-on-error: true

      - name: Package binary → .tar.gz
        run: |
          if [ -f "dist/vermes" ]; then
            tar -czf Vermes-${{ github.ref_name }}-linux-x64.tar.gz -C dist vermes
          elif [ -d "dist/vermes" ]; then
            tar -czf Vermes-${{ github.ref_name }}-linux-x64.tar.gz -C dist vermes
          else
            echo "No Linux binary found"
          fi

      - name: Upload Release Asset (Linux x64)
        uses: softprops/action-gh-release@v1
        with:
          files: Vermes-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
