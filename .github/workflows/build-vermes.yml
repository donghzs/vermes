name: Build Vermes Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── macOS ARM64 ──────────────────────────────
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller fastapi uvicorn pywebview python-dotenv

      - name: Build macOS .app (PyInstaller)
        run: |
          python3 -m PyInstaller vermes-gui.spec --noconfirm
        continue-on-error: true

      - name: Fallback build (cli.spec)
        if: steps.build-macos-arm64.outcome == 'failure'
        run: |
          python3 -m PyInstaller vermes.spec --noconfirm

      - name: Ad-hoc code sign (remove quarantine)
        run: |
          if [ -d "dist/Vermes.app" ]; then
            codesign --force --deep --sign - dist/Vermes.app || true
            xattr -cr dist/Vermes.app || true
          elif [ -d "dist/vermes.app" ]; then
            codesign --force --deep --sign - dist/vermes.app || true
            xattr -cr dist/vermes.app || true
          fi

      - name: Create .dmg installer
        run: |
          if [ -d "dist/Vermes.app" ]; then
            APP="Vermes.app"
          elif [ -d "dist/vermes.app" ]; then
            APP="vermes.app"
          else
            echo "No .app found"
            exit 1
          fi
          # 创建临时目录结构
          mkdir -p /tmp/dmg-staging
          cp -r "dist/$APP" /tmp/dmg-staging/
          # 创建 Applications 链接
          ln -s /Applications /tmp/dmg-staging/Applications
          # 创建 .dmg
          hdiutil create -volname "Vermes Installer" \
            -srcfolder /tmp/dmg-staging \
            -ov -format UDZO \
            Vermes-${{ github.ref_name }}-macos-arm64.dmg
          # 同时创建 .zip（备用）
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP" Vermes-${{ github.ref_name }}-macos-arm64.zip

      - name: Upload Release Assets (macOS)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Vermes-${{ github.ref_name }}-macos-arm64.dmg
            Vermes-${{ github.ref_name }}-macos-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows x64 ────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn pywebview python-dotenv

      - name: Install NSIS
        run: |
          choco install nsis --version=3.10 -y --no-progress

      - name: Build Windows .exe (PyInstaller)
        run: |
          echo "Building with vermes-gui.spec..."
          & "C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe" -m PyInstaller vermes-gui.spec --noconfirm 2>&1
          echo "Exit code: $LASTEXITCODE"
          echo "=== dist contents ==="
          Get-ChildItem dist -Recurse -Depth 0 | Select-Object Name, FullName | Format-Table -AutoSize

      - name: Package exe → .zip & NSIS installer
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "${{ github.ref_name }}"
          echo "ref=$ref"
          echo "=== dist folder ==="
          Get-ChildItem dist -Recurse | Select-Object Mode, Length, Name | Format-Table -AutoSize | Out-String | ForEach-Object { Write-Host $_ }
          
          # Find the .exe or folder
          if (Test-Path "dist\Vermes") {
            echo "Found: dist\Vermes (folder)"
            $src = "dist\Vermes"
          } elseif (Test-Path "dist\vermes") {
            echo "Found: dist\vermes (folder)"
            $src = "dist\vermes"
          } elseif (Test-Path "dist\Vermes.exe") {
            echo "Found: dist\Vermes.exe (onefile)"
            $src = "dist\Vermes.exe"
          } else {
            echo "ERROR: No build output found!"
            exit 1
          }
          
          # Create zip
          echo "Creating ZIP..."
          if (Test-Path $src -PathType Container) {
            Compress-Archive -Path "$src\*" -DestinationPath "Vermes-${ref}-windows-x64.zip" -Force
          } else {
            Compress-Archive -Path $src -DestinationPath "Vermes-${ref}-windows-x64.zip" -Force
          }
          echo "ZIP: Vermes-${ref}-windows-x64.zip"
          
          # NSIS installer (optional)
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (Test-Path $nsis) {
            echo "Found NSIS, building installer..."
            & $nsis "packaging\vermes-installer.nsi" 2>&1
            if (Test-Path "Vermes-${ref}-windows-x64-Installer.exe") {
              echo "Installer created!"
            } else {
              echo "NSIS script failed, continuing without installer..."
            }
          } else {
            echo "NSIS not found at $nsis, continuing without installer..."
          }

      - name: Upload Release Assets (Windows x64)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Vermes-${{ github.ref_name }}-windows-x64.zip
            Vermes-${{ github.ref_name }}-windows-x64-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Linux x64 ──────────────────────────────────
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller fastapi uvicorn pywebview python-dotenv

      - name: Install system dependencies (WebView2 equivalent)
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.0 libgtk-3-dev

      - name: Build Linux binary (PyInstaller)
        run: |
          python3 -m PyInstaller vermes.spec --noconfirm
        continue-on-error: true

      - name: Package binary → .tar.gz
        run: |
          if [ -f "dist/vermes" ]; then
            tar -czf Vermes-${{ github.ref_name }}-linux-x64.tar.gz -C dist vermes
          elif [ -d "dist/vermes" ]; then
            tar -czf Vermes-${{ github.ref_name }}-linux-x64.tar.gz -C dist vermes
          else
            echo "No Linux binary found"
          fi

      - name: Upload Release Asset (Linux x64)
        uses: softprops/action-gh-release@v1
        with:
          files: Vermes-${{ github.ref_name }}-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
