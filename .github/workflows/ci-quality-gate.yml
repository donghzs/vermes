name: CI Quality Gate

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # L2 全量门：每天北京时间 02:00 跑全量 tests/（报告不阻断）
  schedule:
    - cron: '0 18 * * *'

jobs:
  # ── P0.3: 绿色基线 gate ──
  test-baseline:
    name: Test Baseline (Gateway)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 曾用 `pip install -e ".[test]"`：该 extra 从未存在，pip 对幽灵 extra 只
          # 告警不报错（exit 0）→ fallback 永不触发 → pytest 未安装 →
          # `python -m pytest` 报 "No module named pytest" 又被 `|| true` 吞掉
          # → 本 job 自创建起一直"success"却零测试执行。
          # [dev] 是真实 extra（pytest/pytest-asyncio/pytest-xdist，addopts 的
          # `-n auto` 依赖 xdist）；pytest-timeout 不在 [dev]，显式补装。
          pip install -e ".[dev]" pytest-timeout

      - name: Run gateway tests (hard gate)
        run: |
          # 硬门禁：失败即红。无 `|| true`、无 continue-on-error。
          # QUARANTINE-D2b.txt = D2b-s3 (b0bae268c) 行为变更后未同步更新的
          # 103 个预存失败（根因见清单头注释），显式 deselect 隔离——
          # 清单只许缩短不许加长；其余 ~5600 个测试立即成为真护栏。
          DESELECT=$(grep -v '^#' tests/gateway/QUARANTINE-D2b.txt | grep -v '^$' | sed 's/^/--deselect=/')
          python -m pytest tests/gateway/ \
            --tb=short \
            -q \
            --timeout=60 \
            --ignore=tests/gateway/test_tirith.py \
            $DESELECT

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Gateway hard gate: 失败即阻断（quarantine 见 tests/gateway/QUARANTINE-D2b.txt，$(grep -vc '^#\|^$' tests/gateway/QUARANTINE-D2b.txt) 条待清偿）" >> $GITHUB_STEP_SUMMARY

  # ── 边界优化 #3: 前端 e2e（纯前端 mock，守护 P1-3 SSE 重连+快照合并）──
  frontend-e2e:
    name: Frontend E2E (Playwright, mock)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run frontend e2e (pure-frontend mock)
        run: |
          cd frontend
          npx playwright test --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-junit
          path: frontend/test-results
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "## Frontend E2E (Playwright, mock)" >> $GITHUB_STEP_SUMMARY
          echo "阻断级门禁：失败将阻止 PR 合并。" >> $GITHUB_STEP_SUMMARY
          echo "JUnit 报告见 artifacts \`frontend-e2e-junit\`；HTML 报告见 \`frontend-e2e-report\`。" >> $GITHUB_STEP_SUMMARY

  # ── 边界优化 #4: 跨重启恢复真实后端 e2e（触达 session_plan_store.py）──
  # 阻断级门禁：chromium + python3 已安装；RUN_BACKEND_E2E=1 启用真实后端路径。
  # --retries=1 吸收浏览器 e2e 的偶发抖动；失败即阻断 PR 合并（无 continue-on-error）。
  frontend-e2e-backend:
    name: Frontend E2E (real backend recovery)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run frontend e2e (real-backend recovery)
        env:
          RUN_BACKEND_E2E: '1'
          VERMES_HOME: /tmp/vermes-e2e
        run: |
          cd frontend
          npx playwright test chat-cross-restart.spec.ts --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-backend-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-backend-junit
          path: frontend/test-results
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "## Frontend E2E (real backend recovery)" >> $GITHUB_STEP_SUMMARY
          echo "阻断级门禁：失败将阻止 PR 合并（边界 #4 跨重启 SQLite 恢复路径）。" >> $GITHUB_STEP_SUMMARY
          echo "JUnit 报告见 artifacts \`frontend-e2e-backend-junit\`；HTML 报告见 \`frontend-e2e-backend-report\`。" >> $GITHUB_STEP_SUMMARY

  # ── P0.1: Mac DMG 构建 (Electron) ──
  build-macos-electron:
    name: Build macOS Electron DMG
    runs-on: macos-14
    timeout-minutes: 45
    needs: test-baseline
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e . pyinstaller

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend built ✓"

      - name: Sync frontend to web_dist
        run: |
          rm -rf vermes_cli/web_dist
          cp -R frontend/dist vermes_cli/web_dist

      - name: Sync version
        run: |
          bash scripts/sync-version.sh

      - name: PyInstaller build backend
        run: |
          python3 -m PyInstaller vermes-backend.spec --noconfirm

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      - name: Build Electron DMG (arm64)
        run: |
          cd electron
          npx electron-builder --mac arm64 --publish=never

      - name: Build Electron DMG (x64)
        run: |
          cd electron
          npx electron-builder --mac x64 --publish=never

      # ── P0.2: 构建产物自检 ──
      - name: Verify build artifacts
        run: |
          bash scripts/verify-build.sh

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vermes-macos-dmg
          path: dist-electron/*.dmg
          compression-level: 0
          retention-days: 7

  # ── P0.2: 产物自检（故意漏打测试） ──
  verify-harness-included:
    name: Verify Harness in Build
    runs-on: macos-14
    needs: build-macos-electron
    steps:
      - uses: actions/checkout@v4
      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          name: vermes-macos-dmg
          path: dist-electron
      - name: Run verify-build.sh
        run: bash scripts/verify-build.sh

  # ── L0: 启动守卫 / 更新断路契约（每次 PR/push，硬阻断，<10min）──
  # 守护 P1-① 修复 + c1-c5 启动守卫 harness：从磁盘抽真实函数体执行（非逻辑副本），
  # 防止"存在性判断永真"断路、splash 错误渲染、字段契约错位、图片老化、资源路径容错
  # 等结构性 bug 在 electron/frontend 侧悄悄复活。CI 此前完全不覆盖这些桌面契约。
  # 跑 scripts/ 下全部 test_*.mjs（纯磁盘、node 执行、失败 process.exit(1)），新增 harness 自动纳入。
  verify-desktop-contracts:
    name: Desktop Contracts (L0, c1-c5 + update-path)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run desktop contract harnesses (c1-c5 + update-path)
        run: |
          fail=0
          for f in scripts/test_*.mjs; do
            echo "── $f ──"
            node "$f" || fail=1
          done
          exit $fail

  # ── L2: 全量门（nightly，报告不阻断）──
  # 唤醒 tests/ 中 75% 的"死资产"测试（当前 test-baseline 只跑 tests/gateway/ ~25%）。
  # 失败只进 summary/artifact，不阻断（本 job 仅 schedule/dispatch 触发，且不作为 required check）。
  # 不加 QUARANTINE deselect：全量真实状态进趋势追踪，预存失败（gateway 103 + agent 15 等）在此暴露逐步清偿。
  nightly-full:
    name: Nightly Full Suite (report-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-timeout
      - name: Run full test suite (report-only, never blocks)
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --timeout=120 \
            --junit-xml=nightly-results.xml
      - name: Upload nightly JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-full-results
          path: nightly-results.xml
          retention-days: 14
      - name: Test summary
        if: always()
        run: |
          echo "## Nightly Full Suite (report-only)" >> $GITHUB_STEP_SUMMARY
          echo "全量 tests/ 已唤醒到 nightly（报告不阻断）。失败数见 artifacts \`nightly-full-results\`。" >> $GITHUB_STEP_SUMMARY
